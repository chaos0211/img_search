  "uvicorn>=0.30.0",
  "streamlit>=1.44.0",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
  "pillow>=10.3.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "scikit-learn>=1.5.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "hnswlib>=0.8.0",
  "matplotlib>=3.9.0",
  "tqdm>=4.66.4",
  "faiss-cpu>=1.13.2",
]
